<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <!-- Keycap outer surface vertical gradient -->
    <linearGradient id="keyBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33363B"/>
      <stop offset="50%" stop-color="#2B2E33"/>
      <stop offset="100%" stop-color="#212528"/>
    </linearGradient>

    <!-- Concave oval finger-dish vertical gradient -->
    <linearGradient id="dishGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2022"/>
      <stop offset="18%" stop-color="#232629"/>
      <stop offset="52%" stop-color="#2E3136"/>
      <stop offset="88%" stop-color="#3E4246"/>
      <stop offset="100%" stop-color="#424649"/>
    </linearGradient>

    <!-- Concave dish subtle rim gradient -->
    <linearGradient id="dishRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D4245" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#3B3F44" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#464A4E" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Metallic outer bezel gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2ECD4"/>
      <stop offset="14%" stop-color="#B4B9BC"/>
      <stop offset="50%" stop-color="#ACAFB4"/>
      <stop offset="100%" stop-color="#A2A5A9"/>
    </linearGradient>

    <!-- Soft ambient green LED glow -->
    <radialGradient id="ledAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EFD7E" stop-opacity="0.58"/>
      <stop offset="28%" stop-color="#0EFD7E" stop-opacity="0.28"/>
      <stop offset="62%" stop-color="#0EFD7E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0EFD7E" stop-opacity="0"/>
    </radialGradient>

    <!-- Bright LED core gradient -->
    <radialGradient id="ledCore" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5BFF9F"/>
      <stop offset="65%" stop-color="#0EFD7E"/>
      <stop offset="100%" stop-color="#08D668"/>
    </radialGradient>

    <!-- Clip path for keycap interior -->
    <clipPath id="keyClip">
      <rect x="184" y="120" width="1008" height="528" rx="84" ry="84"/>
    </clipPath>
  </defs>

  <!-- Dark obsidian background -->
  <rect width="1376" height="768" rx="32" ry="32" fill="#0C0F14"/>

  <!-- Subtle outer halo on top-left bezel from green LED -->
  <circle cx="250" cy="190" r="105" fill="url(#ledAmbientGlow)" opacity="0.45"/>

  <!-- Keycap dark recessed groove inside silver rim -->
  <rect x="188" y="124" width="1000" height="520" rx="80" ry="80" fill="#080C0F"/>

  <!-- Main keycap body -->
  <rect x="197" y="133" width="982" height="502" rx="72" ry="72" fill="url(#keyBodyGrad)"/>

  <!-- Concave oval finger-dish indentation -->
  <rect x="236" y="178" width="904" height="416" rx="208" ry="208" fill="url(#dishGrad)" stroke="url(#dishRimGrad)" stroke-width="2"/>

  <!-- Soft green LED ambient glow across top-left keycap & dish -->
  <g clip-path="url(#keyClip)">
    <circle cx="261" cy="197" r="140" fill="url(#ledAmbientGlow)"/>
  </g>

  <!-- Outer silver metallic bezel rim -->
  <rect x="189" y="125" width="998" height="518" rx="79" ry="79" fill="none" stroke="url(#rimGrad)" stroke-width="10"/>

  <!-- Top-left circular green dot LED -->
  <circle cx="261" cy="197" r="28.5" fill="url(#ledCore)"/>

  <!-- Center "caps on" geometric circular-bowl typography (converted to exact Bézier outlines) -->
