  </g>

  <!-- Right "///" glowing green LED indicator -->
  <g transform="translate(-2.52, 0)" stroke-linejoin="round" stroke-linecap="round">
    <!-- Smooth diffused green LED corona -->
    <g fill="#0EFD7E" stroke="#0EFD7E" stroke-width="6" opacity="0.65" filter="url(#slashLedBloom)">
      <path d="M 785.757812 439.359375 L 793.804688 439.359375 L 828.601562 335.3125 L 820.195312 335.3125 Z M 833.402344 424 "/>
      <path d="M 841.195312 439.359375 L 849.242188 439.359375 L 884.039062 335.3125 L 875.632812 335.3125 Z M 888.839844 424 "/>
      <path d="M 896.636719 439.359375 L 904.683594 439.359375 L 939.480469 335.3125 L 931.074219 335.3125 Z M 944.28125 424 "/>
    </g>
    <!-- Crisp luminous LED core slashes (matching top-left LED intensity & gradient) -->
    <g fill="url(#slashLedCore)" stroke="url(#slashLedCore)" stroke-width="2.2">
      <path d="M 785.757812 439.359375 L 793.804688 439.359375 L 828.601562 335.3125 L 820.195312 335.3125 Z M 833.402344 424 "/>
      <path d="M 841.195312 439.359375 L 849.242188 439.359375 L 884.039062 335.3125 L 875.632812 335.3125 Z M 888.839844 424 "/>
      <path d="M 896.636719 439.359375 L 904.683594 439.359375 L 939.480469 335.3125 L 931.074219 335.3125 Z M 944.28125 424 "/>
    </g>
  </g>
</svg>
